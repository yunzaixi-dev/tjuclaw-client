[package]
name = "tjuclaw-client"
version = "0.0.0"
description = "TJUClaw native client"
authors = ["TJUClaw contributors"]
edition = "2021"
publish = false
license = "GPL-3.0-only"

[lib]
name = "tjuclaw_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Desktop Agent sandbox: loopback gateway calls and its HMAC access tokens.
base64 = "0.22"
getrandom = "0.3"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["json"] }
tauri-plugin-updater = "=2.12.0"
tauri-plugin-process = "=2.3.1"
