name: 'Setup CI toolchain'
description: 'Sets up Node.js, pnpm, Go, Task, and runs preflight verification'
inputs:
  profile:
    description: 'Preflight profile to verify (portable, linux, android)'
    required: false
    default: 'portable'
  rust:
    description: 'Whether to install stable Rust'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up pinned pnpm
      uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      with:
        run_install: false
    - name: Set up Node.js 24
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: '24'
        cache: pnpm

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: '1.26.x'
        cache: false

    - name: Install Task 3.49.1
      shell: bash
      run: |
        go install github.com/go-task/task/v3/cmd/task@v3.49.1
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Set up Rust (minimal stable)
      if: inputs.rust == 'true'
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable

    - name: Run CI preflight
      shell: bash
      run: node scripts/ci-preflight.mjs "${{ inputs.profile }}"

    - name: Install locked dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --fetch-timeout 600000 --network-concurrency 4
