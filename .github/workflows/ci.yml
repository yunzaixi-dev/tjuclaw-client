name: CI

on:
  push:
    branches:
      - dev
      - release
    tags: ['**']
  pull_request:
    branches:
      - dev
      - release
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  deploy-web:
    needs: [build-artifacts, check, browser]
    uses: ./.github/workflows/deploy-edgeone.yml
    secrets: inherit

  check:
    name: Portable checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup
        with:
          profile: portable

      - name: Run portable checks
        run: task check

  browser:
    name: Browser UI and workspace regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup
        with:
          profile: portable

      - name: Install Chromium with system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Web once, then run UI and workspace regressions
        run: |
          task web:build
          pnpm exec playwright test --config scripts/playwright.config.mjs
          pnpm exec playwright test --config scripts/workspace.playwright.config.mjs

  build-artifacts:
    name: Build Web Client
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup
        with:
          profile: portable

      - name: Build Web
        run: task web:build

      - name: Upload Web artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Build Linux amd64 Debian package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Restore Rust build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: linux-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Install Linux native system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev \
            librsvg2-dev libayatana-appindicator3-dev patchelf file xvfb xauth

      - name: Set up toolchain
        uses: ./.github/actions/setup
        with:
          profile: linux
          rust: 'true'

      - name: Build Debian package
        run: task linux:build

      - name: Smoke-test packaged Debian application and WebKit startup
        run: xvfb-run -a bash scripts/linux-native-smoke.sh

      - name: Upload Linux deb artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ github.sha }}
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7

  build-android:
    name: Build Android debug arm64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_INCREMENTAL: 'false'
      GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx768m -XX:MaxMetaspaceSize=384m" -Dorg.gradle.workers.max=1 -Dorg.gradle.daemon=false -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process'
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Restore Android build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.gradle/caches
            ~/.gradle/wrapper
            src-tauri/target
          key: android-cargo-gradle-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/gen/android/gradle/**') }}
          restore-keys: android-cargo-gradle-

      - name: Select installed Java 17 and Android NDK
        run: |
          test -x "$JAVA_HOME_17_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Android SDK platform, build-tools and NDK
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Set up Go for Task installation
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Install Task 3.49.1
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.49.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set up Rust (minimal stable) and Android targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Run CI preflight for Android
        run: node scripts/ci-preflight.mjs android

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --fetch-timeout 600000 --network-concurrency 4

      - name: Build Android debug APK
        run: task android:build

      - name: Upload installable Android debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-debug-${{ github.sha }}
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Compile and verify unsigned Android release APK
        run: task android:release:check

      - name: Upload unsigned Android release compilation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release-unsigned-${{ github.sha }}
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: Build unsigned universal macOS app
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Restore Rust build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: macos-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: macos-cargo-
      - name: Set up toolchain
        uses: ./.github/actions/setup
        with:
          profile: macos
          rust: 'true'
      - name: Build universal app
        run: task macos:build
      - name: Verify universal app executable
        run: node scripts/verify-apple-bundles.mjs macos
      - name: Archive app bundle without losing symlinks
        run: tar -czf macos-unsigned.tar.gz -C src-tauri/target/universal-apple-darwin/release/bundle/macos TJUClaw.app
      - name: Upload macOS app artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-unsigned-${{ github.sha }}
          path: macos-unsigned.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-ios:
    name: Compile unsigned iOS device and simulator archives
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Restore Rust build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ios-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ios-cargo-
      - name: Set up toolchain
        uses: ./.github/actions/setup
        with:
          profile: ios
          rust: 'true'
      - name: Compile device and simulator archives
        run: task ios:build
      - name: Verify device and simulator executables
        run: node scripts/verify-apple-bundles.mjs ios
      - name: Archive both unsigned iOS builds without losing symlinks
        run: |
          test -d src-tauri/gen/apple/archives/device
          test -d src-tauri/gen/apple/archives/simulator
          tar -czf ios-unsigned.tar.gz -C src-tauri/gen/apple archives
      - name: Upload unsigned iOS archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-unsigned-${{ github.sha }}
          path: ios-unsigned.tar.gz
          if-no-files-found: error
          retention-days: 7
