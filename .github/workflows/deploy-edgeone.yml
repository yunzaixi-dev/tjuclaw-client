name: Deploy Web to EdgeOne
on:
  workflow_call: {}
permissions:
  contents: read
concurrency:
  group: production-web
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'yunzaixi-dev/tjuclaw-client' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-${{ github.sha }}
          path: web
      - name: Publish verified artifact from the current release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          EDGEONE_TOKEN: ${{ secrets.EDGEONE_TOKEN }}
          EDGEONE_PROJECT_NAME: ${{ vars.EDGEONE_PROJECT_NAME }}
          EDGEONE_AREA: ${{ vars.EDGEONE_AREA || 'global' }}
        run: |
          set -euo pipefail
          latest=$(gh api repos/yunzaixi-dev/tjuclaw-client/git/ref/heads/release --jq .object.sha)
          if [ "$latest" != "$RELEASE_SHA" ]; then
            echo 'A newer release exists; obsolete Web deployment skipped.'
            exit 0
          fi
          test -n "$EDGEONE_TOKEN" || { echo 'Missing production secret EDGEONE_TOKEN'; exit 1; }
          test -n "$EDGEONE_PROJECT_NAME" || { echo 'Missing production variable EDGEONE_PROJECT_NAME'; exit 1; }
          test -f web/index.html
          mkdir -p edge-deploy
          cp -R web edge-deploy/assets
          cp -R functions edge-deploy/functions
          node -e 'require("fs").writeFileSync("edge-deploy/edgeone.json", JSON.stringify({outputDirectory:"assets"}))'
          cd edge-deploy
          npx --yes edgeone@1.6.37 makers build
          test -f .edgeone/edge-functions/index.js
          test -f .edgeone/assets/index.html
          npx --yes edgeone@1.6.37 makers deploy .edgeone --name "$EDGEONE_PROJECT_NAME" --env production --area "$EDGEONE_AREA" --token "$EDGEONE_TOKEN" --json
