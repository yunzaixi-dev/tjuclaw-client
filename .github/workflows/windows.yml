name: Windows Installer

on:
  push:
    branches:
      - dev
      - release
  pull_request:
    branches:
      - dev
      - release
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Restore Rust build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            src-tauri\target
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-cargo-
      - name: Set up pinned pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Set up Go for Task installation
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Install Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.49.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Set up Rust MSVC
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check build toolchain
        run: node scripts/ci-preflight.mjs windows
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --fetch-timeout 600000 --network-concurrency 4
      - name: Build unsigned installer
        run: task windows:build
      - name: Record source and installer checksums
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          $files = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe -ErrorAction Stop)
          if ($files.Count -eq 0) { throw 'No NSIS installer was produced.' }
          $manifest = @("source=$env:SOURCE_SHA")
          foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            $manifest += "$hash  $($file.Name)"
          }
          $manifest | Out-File src-tauri/target/release/bundle/nsis/SHA256SUMS.txt -Encoding utf8
      - name: Upload unsigned build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-unsigned-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
