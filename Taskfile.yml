version: '3'

dotenv: ['.env.toolchain.local']

tasks:
  default:
    desc: List development commands
    cmds: [task --list]
  setup:
    desc: Install locked JS dependencies
    cmds:
      - pnpm install --frozen-lockfile
  doctor:
    desc: Check development tools
    cmds: ['node --version', 'pnpm --version', 'task --version']
  dev:
    desc: Run Web client on loopback port 5173
    cmds: [pnpm run dev]
  web:dev:
    desc: Run Web client on loopback port 5173
    cmds: [pnpm run dev]
  web:build:
    desc: Build Web client
    cmds: [pnpm run build]
  web:preview:
    desc: Preview built Web client on loopback port 4173
    cmds: [pnpm run preview]
  ui:install:
    desc: Install the Chromium browser used by UI regression tests
    cmds: [pnpm exec playwright install chromium]
  ui:test:
    desc: Build and test appearance, keyboard access and four responsive sizes
    cmds:
      - task: web:build
      - pnpm exec playwright test --config scripts/playwright.config.mjs
  workspace:test:
    desc: Test knowledge workspace client behavior using isolated mocks

    cmds:
      - task: web:build
      - pnpm exec playwright test --config scripts/workspace.playwright.config.mjs {{.CLI_ARGS}}
  lint:
    desc: Check JS/TS source
    cmds: [pnpm run lint]
  types:
    desc: Check client types
    cmds: [pnpm run types:check]
  check:
    desc: Run portable checks
    cmds:
      - task: lint
      - task: types
      - pnpm run test:tooling
  build:
    desc: Build Web client
    cmds:
      - task: web:build
  native:info:
    desc: Inspect Tauri and native SDK requirements
    cmds: [pnpm run tauri info]
  native:icons:
    desc: Regenerate platform icons from the black-background app icon
    cmds: [pnpm run tauri icon app-icon.png]
  native:check:
    desc: Check native Rust code on the current host
    dir: src-tauri
    cmds: [node ../scripts/native.mjs cargo check --locked]
  native:fmt:
    desc: Format native Rust code
    dir: src-tauri
    cmds: [node ../scripts/native.mjs cargo fmt]
  desktop:dev:
    desc: Run native desktop development client
    cmds: [pnpm run tauri dev]
  linux:build:
    desc: Build Linux amd64 Debian package on Linux
    preconditions:
      - sh: >-
          node -e "process.exit(process.platform === 'linux' ? 0 : 1)"
        msg: This build requires a Linux host.
    cmds: [pnpm run tauri build --bundles deb -- --locked]
  windows:build:
    desc: Build unsigned Windows NSIS installer on Windows
    preconditions:
      - sh: >-
          node -e "process.exit(process.platform === 'win32' ? 0 : 1)"
        msg: This build requires a Windows host with MSVC.
    cmds: [pnpm run tauri build --bundles nsis -- --locked]
  macos:build:
    desc: Build unsigned universal macOS app on macOS
    preconditions:
      - sh: >-
          node -e "process.exit(process.platform === 'darwin' ? 0 : 1)"
        msg: This build requires macOS with Xcode and both Apple desktop Rust targets.
    cmds: [pnpm run tauri build --target universal-apple-darwin --bundles app --no-sign --ci -- --locked]
  ios:init:
    desc: Generate the iOS Xcode project on macOS
    preconditions:
      - sh: >-
          node -e "process.exit(process.platform === 'darwin' ? 0 : 1)"
        msg: This build requires macOS with Xcode.
    cmds: [pnpm run tauri ios init --ci --skip-targets-install]
  ios:build:
    desc: Compile and preserve separate unsigned iOS device and simulator archives on macOS
    preconditions:
      - sh: >-
          node -e "process.exit(process.platform === 'darwin' ? 0 : 1)"
        msg: This build requires macOS with Xcode and the iOS Rust targets.
    cmds:
      - task: ios:init
      - pnpm run tauri ios build --target aarch64 --no-sign --archive-only --ci -- --locked
      - node scripts/ios-archive.mjs device
      - pnpm run tauri ios build --target aarch64-sim --no-sign --archive-only --ci -- --locked
      - node scripts/ios-archive.mjs simulator
  android:init:
    desc: Generate Android project
    cmds: [pnpm run tauri android init --ci --skip-targets-install]
    status:
      - test -f src-tauri/gen/android/gradlew
  android:targets:
    desc: Install Rust targets used by the generated Android project
    cmds: [node scripts/native.mjs rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android]
  android:dev:
    desc: Run Android client on connected device
    cmds:
      - task: android:init
      - pnpm run tauri android dev
  android:build:
    desc: Build installable debug APK for arm64
    cmds:
      - task: android:init
      - pnpm run tauri android build --debug --apk --target aarch64 --ci -- --locked
      - node scripts/verify-android-apk.mjs debug
  android:release:check:
    desc: Compile an unsigned arm64 release APK (not installable)
    cmds:
      - task: android:init
      - pnpm run tauri android build --apk --target aarch64 --ci -- --locked
      - node scripts/verify-android-apk.mjs release
